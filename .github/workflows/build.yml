name: Build native plugins and installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable engine tests
        run: cmake -S . -B build -DTF_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  native:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS universal VST3, AU and AU MIDI FX
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Configure Windows x64 VST3
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Build native binaries
        run: cmake --build build --config Release --parallel 3
      - name: Test engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package universal Mac installer
        if: runner.os == 'macOS'
        run: bash packaging/macos.sh build dist 0.1.0
      - name: Validate both Audio Units
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "dist/macos-root/Library/Audio/Plug-Ins/Components/Trailer Force.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          cp -R "dist/macos-root/Library/Audio/Plug-Ins/Components/Trailer Force MIDI FX.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar || true
          auval -v aumu TrFc Vnci
          auval -v aumi TrFm Vnci
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/*Setup.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - name: Upload installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: TrailerForce-${{ runner.os }}-installers
          path: |
            dist/*.pkg
            dist/*.sha256
            dist/*.exe
            dist/SHA256.txt
          if-no-files-found: error
      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: TrailerForce-${{ runner.os }}-plugins
          path: |
            build/TrailerForce_artefacts/Release/VST3/
            build/TrailerForce_artefacts/Release/AU/
            build/TrailerForceMidi_artefacts/Release/AU/
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TrailerForce-*-installers
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-preview.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Trailer Force 0.1.0 — native preview build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: installers/*
